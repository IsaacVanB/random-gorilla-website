<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Random Gorilla</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="gorilla_pages.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      text-align: center;
      color: #241407;
      background:
        linear-gradient(rgba(255, 246, 222, 0.55), rgba(255, 246, 222, 0.78)),
        url("bg.jpg") center / cover fixed;
    }

    main {
      width: min(100%, 650px);
      padding: 2rem;
      border: 1px solid rgba(68, 38, 11, 0.25);
      border-radius: 8px;
      background: rgba(255, 250, 238, 0.9);
      box-shadow: 0 24px 70px rgba(42, 24, 7, 0.28);
      backdrop-filter: blur(3px);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      margin-top: 0.25rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.5rem, 14vw, 6.5rem);
      font-style: italic;
      font-weight: 900;
      color: #4f2709;
      text-shadow:
        0 2px 0 #f5c86a,
        0 6px 18px rgba(69, 36, 9, 0.35);
    }

    h2 {
      margin: 0 0 0.85rem;
      font-size: 1.25rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .portrait {
      display: block;
      width: min(100%, 280px);
      aspect-ratio: 533 / 800;
      margin: 0 auto 1.5rem;
      border: 6px solid #fff7e4;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 16px 35px rgba(42, 24, 7, 0.3);
    }

    button, a.button {
      font: inherit;
      display: inline-block;
      padding: 0.8rem 1rem;
      border: 1px solid #4f2709;
      border-radius: 8px;
      background: #fff7e4;
      color: #241407;
      text-decoration: none;
      cursor: pointer;
      margin: 0.25rem;
      box-shadow: 0 4px 0 #d69a34;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover, a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #d69a34;
    }

    button:active, a.button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 #d69a34;
    }

    .database-link {
      color: #4f2709;
      font-weight: 700;
      text-underline-offset: 0.2em;
    }

    .filter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0 0 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter input {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: #4f2709;
      cursor: pointer;
    }

    .birthday-search {
      margin: 1.25rem 0;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(68, 38, 11, 0.18);
    }

    .birthday-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .birthday-controls label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
    }

    .birthday-controls input {
      font: inherit;
      min-height: 3rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #4f2709;
      border-radius: 8px;
      background: #fffdf7;
      color: #241407;
    }

    .birthday-results {
      margin: 1rem 0 0;
      padding: 0;
      list-style: none;
    }

    .birthday-results li + li {
      margin-top: 0.45rem;
    }

    .birthday-results a {
      color: #4f2709;
      font-weight: 700;
      text-underline-offset: 0.2em;
    }

    code {
      background: #fff1c7;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      main {
        padding: 1.25rem;
      }

      button, a.button {
        width: 100%;
        margin-right: 0;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>SHOW ME A <span>GORILLA</span></h1>

    <img class="portrait" src="SukiPortrait.jpg" alt="Suki portrait">

    <p id="status">Loading gorilla pages...</p>

    <label class="filter">
      <input id="aliveOnly" type="checkbox">
      Only show alive gorillas
    </label>

    <button onclick="openRandomGorilla(false)">Open in this tab</button>
    <button onclick="openRandomGorilla(true)">Open in new tab</button>

    <p>
      <a class="database-link" href="https://www.gorillasland.com/gorilla-database.php" target="_blank" rel="noopener noreferrer">Open gorilla database</a>
    </p>

    <section class="birthday-search" aria-labelledby="birthdayHeading">
      <h2 id="birthdayHeading">Birthday matches</h2>
      <div class="birthday-controls">
        <label for="birthday">Birthday</label>
        <input id="birthday" type="text" inputmode="numeric" placeholder="MM/DD or MM/DD/YYYY">
        <button type="button" onclick="showBirthdayMatches()">Find matches</button>
      </div>
      <p id="birthdayStatus"></p>
      <ul id="birthdayResults" class="birthday-results"></ul>
    </section>

  </main>

  <script>
    function getPageRecords() {
      if (Array.isArray(window.GORILLA_PAGE_DATA)) {
        return window.GORILLA_PAGE_DATA.filter(record =>
          record &&
          typeof record.url === "string" &&
          record.url.startsWith("https://www.gorillasland.com/")
        );
      }

      if (!Array.isArray(window.GORILLA_PAGES)) {
        return [];
      }

      return window.GORILLA_PAGES.filter(url =>
        typeof url === "string" &&
        url.startsWith("https://www.gorillasland.com/")
      ).map(url => ({
        url,
        isAlive: null
      }));
    }

    function hasAliveMetadata() {
      return Array.isArray(window.GORILLA_PAGE_DATA);
    }

    function hasBirthdayMetadata() {
      return Array.isArray(window.GORILLA_PAGE_DATA) &&
        window.GORILLA_PAGE_DATA.some(record =>
          record &&
          Object.prototype.hasOwnProperty.call(record, "birthMonthDay")
        );
    }

    function getUpdatedText() {
      if (typeof window.GORILLA_PAGES_UPDATED !== "string") {
        return "";
      }

      const date = new Date(`${window.GORILLA_PAGES_UPDATED}T00:00:00`);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return ` Last updated ${date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      })}.`;
    }

    function getPages() {
      const aliveOnly = hasAliveMetadata() && document.getElementById("aliveOnly").checked;
      const records = getPageRecords();

      return records
        .filter(record => !aliveOnly || record.isAlive === true)
        .map(record => record.url);
    }

    function randomChoice(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function getProfileName(record) {
      if (typeof record.name === "string" && record.name.trim()) {
        return record.name.trim();
      }

      const filename = record.url.split("/").pop().replace(/\.php$/i, "");

      return decodeURIComponent(filename)
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function clearBirthdayMatches() {
      document.getElementById("birthdayStatus").textContent = "";
      document.getElementById("birthdayResults").replaceChildren();
    }

    function updateBirthdayMatches() {
      if (document.getElementById("birthday").value.trim()) {
        showBirthdayMatches();
      } else {
        clearBirthdayMatches();
      }
    }

    function isValidMonthDay(month, day) {
      const daysByMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

      return Number.isInteger(month) &&
        Number.isInteger(day) &&
        month >= 1 &&
        month <= 12 &&
        day >= 1 &&
        day <= daysByMonth[month - 1];
    }

    function isValidFullDate(year, month, day) {
      const date = new Date(year, month - 1, day);

      return date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day;
    }

    function padDatePart(value) {
      return String(value).padStart(2, "0");
    }

    function parseBirthdaySearch(value) {
      const cleaned = value.trim();
      let match = cleaned.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      if (match) {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        if (isValidFullDate(year, month, day)) {
          return {
            birthDate: `${year}-${padDatePart(month)}-${padDatePart(day)}`,
            birthMonthDay: `${padDatePart(month)}-${padDatePart(day)}`
          };
        }

        return null;
      }

      match = cleaned.match(/^(\d{1,2})[/-](\d{1,2})(?:[/-](\d{4}))?$/);

      if (!match) {
        return null;
      }

      const month = Number(match[1]);
      const day = Number(match[2]);
      const year = match[3] ? Number(match[3]) : null;

      if (year !== null) {
        if (!isValidFullDate(year, month, day)) {
          return null;
        }

        return {
          birthDate: `${year}-${padDatePart(month)}-${padDatePart(day)}`,
          birthMonthDay: `${padDatePart(month)}-${padDatePart(day)}`
        };
      }

      if (!isValidMonthDay(month, day)) {
        return null;
      }

      return {
        birthDate: null,
        birthMonthDay: `${padDatePart(month)}-${padDatePart(day)}`
      };
    }

    function showBirthdayMatches() {
      const birthdayInput = document.getElementById("birthday");
      const birthdayStatus = document.getElementById("birthdayStatus");
      const birthdayResults = document.getElementById("birthdayResults");
      const birthday = birthdayInput.value.trim();

      birthdayResults.replaceChildren();

      if (!birthday) {
        birthdayStatus.textContent = "Enter a birthday to find matching gorilla profiles.";
        return;
      }

      if (!hasBirthdayMetadata()) {
        birthdayStatus.textContent = "Re-run build_gorilla_list.py to enable birthday matching.";
        return;
      }

      const parsedBirthday = parseBirthdaySearch(birthday);

      if (!parsedBirthday) {
        birthdayStatus.textContent = "Enter a birthday as MM/DD, MM-DD, YYYY-MM-DD, or MM/DD/YYYY.";
        return;
      }

      const matches = getPageRecords().filter(record => {
        if (parsedBirthday.birthDate) {
          return record.birthDate === parsedBirthday.birthDate;
        }

        return record.birthMonthDay === parsedBirthday.birthMonthDay;
      });

      if (matches.length === 0) {
        birthdayStatus.textContent = "No gorilla profiles matched that birthday.";
        return;
      }

      birthdayStatus.textContent =
        `Found ${matches.length} gorilla profile${matches.length === 1 ? "" : "s"} with that birthday.`;

      for (const record of matches) {
        const item = document.createElement("li");
        const link = document.createElement("a");

        link.href = record.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = getProfileName(record);

        item.append(link);
        birthdayResults.append(item);
      }
    }

    function openRandomGorilla(newTab) {
      const pages = getPages();

      if (pages.length === 0) {
        alert("No gorilla pages found. Run build_gorilla_list.py first.");
        return;
      }

      const url = randomChoice(pages);

      if (newTab) {
        window.open(url, "_blank", "noopener,noreferrer");
      } else {
        window.location.href = url;
      }
    }

    function updateStatus() {
      const records = getPageRecords();
      const pages = getPages();
      const aliveOnly = hasAliveMetadata() && document.getElementById("aliveOnly").checked;
      const updatedText = getUpdatedText();

      const statusText = aliveOnly
        ? `Loaded ${pages.length} alive gorilla pages.`
        : hasAliveMetadata()
          ? `Loaded ${records.length} gorilla pages.`
          : `Loaded ${records.length} gorilla pages. Re-run build_gorilla_list.py to enable alive-only filtering.`;

      document.getElementById("status").textContent = `${statusText}${updatedText}`;
    }

    const aliveOnlyInput = document.getElementById("aliveOnly");
    aliveOnlyInput.disabled = !hasAliveMetadata();
    aliveOnlyInput.addEventListener("change", updateStatus);
    updateStatus();

    document.getElementById("birthday").addEventListener("input", updateBirthdayMatches);

    const params = new URLSearchParams(window.location.search);
    if (params.get("auto") === "1") {
      openRandomGorilla(false);
    }
  </script>
</body>
</html>
